<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policies added · Renewal Desk prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E63}a:hover{color:#08544B}
</style>
<style>
[hidden]{display:none!important}
html,body{background:#CBD5D3}
.stage{display:flex;justify-content:center;padding:24px 0}
.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}
@media (max-width:440px){html,body{background:#F3F5F4}.stage{padding:0}.screen{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #13272B; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">
<main style="flex: 1; min-height: 0; padding: 64px 18px 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 76px; height: 76px; border-radius: 38px; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">7 policies added</h1>
<p style="margin: 0; color: #4A5E63">Your book now has 52 customers and 61 policies.</p>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE3E2; border-radius: 14px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #E1F0EC; color: #0B6E63; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1.5"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Next due</span><span style="font-size: 13px; color: #5B6E73">Lakshmi N · ₹10,577 · Wed 7 Oct</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #EDF1F0">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #E1F0EC; color: #0B6E63; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Reminders are on</span><span style="font-size: 13px; color: #5B6E73">7 days and 1 day before each due date</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #EDF1F0">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #E3EBF7; color: #234B8A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="1.5"></rect><circle cx="12" cy="13" r="2.5"></circle></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Money coming</span><span style="font-size: 13px; color: #5B6E73">2 payouts to customers in the next 12 months</span></span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #EDF1F0">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #FDF1E2; color: #7A3F05; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v6M12 17v.5"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">1 photo to retake</span><span style="font-size: 13px; color: #5B6E73">Photo 6 was too blurry</span></span>
</div>
</div>
<div style="flex: 1"></div>
<a href="index.html" style="min-height: 52px; border-radius: 26px; background: #0B6E63; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Go to Home</a>
<a href="add.html" style="min-height: 48px; border-radius: 24px; border: 1px solid #C9D4D2; background: #FFFFFF; color: #13272B; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Add more</a>
</main>
</div>
</div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var w=window.innerWidth;var k=Math.min(1,w/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
</body>
</html>
