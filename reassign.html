<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reassign · Renewal Desk prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Tamil:wght@400;600&amp;display=swap">
<style>
body{margin:0}a{color:#0A6C5C}a:hover{color:#075548}[hidden]{display:none!important}main>*{flex-shrink:0}input[role=switch]{-webkit-appearance:none;appearance:none;width:44px!important;height:26px!important;border-radius:13px;background:#D0D5DD;position:relative;cursor:pointer;transition:background .15s}input[role=switch]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left .15s}input[role=switch]:checked{background:#0A6C5C}input[role=switch]:checked::after{left:21px}

.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}
@media (max-width:440px){html,body{background:#F3F5F7}.stage{padding:0}.screen{border-radius:0;box-shadow:none}}

<body>
<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; color: #101828; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden"><header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 6px; min-height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; flex: none"><a href="team.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #101828; text-decoration: none; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 style="margin: 0; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 18px; font-weight: 800; line-height: 1.3">Murali is leaving</h1></div><span style="font-size: 13px; font-weight: 500; color: #5B6576">Keep his customers safe</span></div></header><main style="flex: 1; min-height: 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><span style="display: flex; justify-content: space-between; gap: 6px"><span style="font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 21px; font-weight: 800; color: #101828">46</span></span><span style="font-size: 12.5px; font-weight: 600; color: #5B6576; line-height: 1.3">customers</span></div><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><span style="display: flex; justify-content: space-between; gap: 6px"><span style="font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 21px; font-weight: 800; color: #93460A">9</span><span style="width: 8px; height: 8px; border-radius: 4px; background: #93460A; flex: none; margin-top: 6px"></span></span><span style="font-size: 12.5px; font-weight: 600; color: #5B6576; line-height: 1.3">due this month</span></div><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><span style="display: flex; justify-content: space-between; gap: 6px"><span style="font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 21px; font-weight: 800; color: #A8231A">₹4,850</span><span style="width: 8px; height: 8px; border-radius: 4px; background: #A8231A; flex: none; margin-top: 6px"></span></span><span style="font-size: 12.5px; font-weight: 600; color: #5B6576; line-height: 1.3">at risk</span></div></div><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px"><div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 16px; font-weight: 800">Who takes over?</h2></div></div><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-hei Off: customers get no message</span></label><input type="checkbox" id="ra4" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div></div><p style="margin: 0; font-size: 13px; font-weight: 500; color: #5B6576; line-height: 1.5">History, messages and documents move with each customer. Nothing is lost when someone leaves.</p><div style="flex: 1"></div><a href="team.html" style="min-height: 52px; border-radius: 14px; background: #0A6C5C; color: #FFFFFF; border: 0; font-size: 16px; font-family: inherit; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; width: 100%; flex: none">Move 46 customers</a></main></div>
</div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
