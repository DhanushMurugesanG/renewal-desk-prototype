<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Renewal Desk prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}a{color:#0B6E63}a:hover{color:#08544B}[hidden]{display:none!important}
html,body{background:#CBD5D3}.stage{display:flex;justify-content:center;padding:24px 0}
.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}
@media (max-width:440px){html,body{background:#F3F5F4}.stage{padding:0}.screen{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #13272B; font-family: 'IBM Plex Sans', 'Noto Sans Tamil', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden"><main style="flex: 1; min-height: 0; padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 40px"><span style="width: 56px; height: 56px; border-radius: 16px; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path><path d="M12 7v5l3 2"></path></svg></span><h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Renewal Desk</h1><p style="margin: 0; color: #4A5E63; font-size: 16px">Your renewals, looked after.</p></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="mobile" style="font-size: 13px; font-weight: 600; color: #4A5E63">Mobile number</label><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #C9D4D2; border-radius: 12px; padding: 0 14px; min-height: 50px"><span style="color: #5B6E73; font-weight: 600">+91</span><input id="mobile" type="tel" value="98765 43210" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #13272B; background: transparent; min-height: 46px"></div></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #4A5E63">Code sent by SMS</span><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0B6E63; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">4</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0B6E63; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">8</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0B6E63; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700">2</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9D4D2; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700"></span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9D4D2; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700"></span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #C9D4D2; display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 22px; font-weight: 700"></span></div></div><a href="setup.html" style="min-height: 52px; border-radius: 26px; background: #0B6E63; color: #FFFFFF; border: 0; font-size: 16px; font-family: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; width: 100%">Continue</a><div style="flex: 1"></div><div style="background: #E1F0EC; border: 1px solid #E1F0EC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px"><span style="display: flex; gap: 10px; align-items: center; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Your customers stay yours</span><span style="font-size: 13px; color: #4A5E63">No password. We never contact your customers, never sell data, and you can export everything any time.</span></div></main></div>
</div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
</body>
</html>
