<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · NoLapse prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Tamil:wght@400;600&amp;display=swap">
<style>
body{margin:0}a{color:#0A6C5C}a:hover{color:#075548}[hidden]{display:none!important}main>*{flex-shrink:0}input[role=switch]{-webkit-appearance:none;appearance:none;width:44px!important;height:26px!important;border-radius:13px;background:#D0D5DD;position:relative;cursor:pointer;transition:background .15s}input[role=switch]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left .15s}input[role=switch]:checked{background:#0A6C5C}input[role=switch]:checked::after{left:21px}
html,body{background:#DDE2E8}.stage{display:flex;justify-content:center;padding:24px 0}
.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}
@media (max-width:440px){html,body{background:#F3F5F7}.stage{padding:0}.screen{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; color: #101828; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden"><main style="flex: 1; min-height: 0; padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 36px"><span style="width: 56px; height: 56px; border-radius: 16px; background: #0A6C5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"></path><path d="M20.5 3.5v4h-4"></path><path d="M8.5 12.2l2.4 2.4 4.6-4.8"></path></svg></span><h1 style="margin: 0; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 30px; font-weight: 800">NoLapse</h1><p style="margin: -6px 0 0; color: #475467; font-size: 16px; font-weight: 500">Never lose a renewal.</p></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="mobile" style="font-size: 13px; font-weight: 700; color: #344054">Mobile number</label><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 0 14px; min-height: 50px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><span style="color: #5B6576; font-weight: 700">+91</span><input id="mobile" type="tel" value="98765 43210" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; font-weight: 600; color: #101828; background: transparent; min-height: 46px"></div></div><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #475467">Code sent by SMS</span><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px"><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0A6C5C; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700">4</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0A6C5C; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700">8</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #0A6C5C; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700">2</span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D0D5DD; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700"></span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D0D5DD; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700"></span><span style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D0D5DD; display: flex; align-items: center; justify-content: center; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 22px; font-weight: 700"></span></div></div><a href="setup.html" style="min-height: 52px; border-radius: 14px; background: #0A6C5C; color: #FFFFFF; border: 0; font-size: 16px; font-family: inherit; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; width: 100%; flex: none">Continue</a><div style="flex: 1"></div><div style="background: #E6F3EF; border: 1px solid #E6F3EF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px"><span style="display: flex; gap: 10px; align-items: center; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A6C5C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>Your customers stay yours</span><span style="font-size: 13px; color: #475467">No password. We never contact your customers, never sell data, and you can export everything any time.</span></div></main></div>
</div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
</body>
</html>
