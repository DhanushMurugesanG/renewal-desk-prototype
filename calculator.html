<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap">

<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; color: #13272B; font-family: 'IBM Plex Sans', 'Noto Sans Tamil', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden"><header style="display: flex; align-items: center; gap: 6px; padding: 12px 12px 6px"><a href="menu.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #13272B; text-decoration: none; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 20px; font-weight: 700">Quick illustration</h1><span style="padding: 2px 8px; border-radius: 10px; background: #EDF1F0; color: #3E5257; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Later</span></div></div></header><main style="flex: 1; min-height: 0; padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px"><label for="age" style="font-size: 13px; font-weight: 600; color: #4A5E63">Age</label><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #C9D4D2; border-radius: 12px; padding: 0 14px; min-height: 50px"><input id="age" type="number" value="35" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #13272B; background: transparent; min-height: 46px"></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="sa" style="font-size: 13px; font-weight: 600; color: #4A5E63">Sum assured</label><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #C9D4D2; border-radius: 12px; padding: 0 14px; min-height: 50px"><span style="color: #5B6E73; font-weight: 600">₹</span><input id="sa" type="text" value="10,00,000" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #13272B; background: transparent; min-height: 46px"></div></div><div style="display: flex; flex-direction: column; gap: 6px"><label for="term" style="font-size: 13px; font-weight: 600; color: #4A5E63">Term</label><div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #C9D4D2; border-radius: 12px; padding: 0 14px; min-height: 50px"><input id="term" type="text" value="20 years" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #13272B; background: transparent; min-height: 46px"></div></div><div style="background: #E1F0EC; border: 1px solid #E1F0EC; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #5B6E73">Yearly premium</span><span style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 800">[From the insurer's rate table]</span><span style="font-size: 13px; color: #4A5E63">Real numbers come only from the insurer's official rates.</span></div><div style="flex: 1"></div><button type="button" style="min-height: 52px; border-radius: 26px; background: #0B6E63; color: #FFFFFF; border: 0; font-size: 16px; font-family: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; width: 100%; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8- </div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
