<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder settings · NoLapse prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Anek+Tamil:wght@400;600&amp;display=swap">
<style>
body{margin:0}a{color:#0A6C5C}a:hover{color:#075548}[hidden]{display:none!important}main>*{flex-shrink:0}input[role=switch]{-webkit-appearance:none;appearance:none;width:44px!important;height:26px!important;border-radius:13px;background:#D0D5DD;position:relative;cursor:pointer;transition:background .15s}input[role=switch]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 2px rgba(16,24,40,.2);transition:left .15s}input[role=switch]:checked{background:#0A6C5C}input[role=switch]:checked::after{left:21px}
html,body{background:#DDE2E8}.stage{display:flex;justify-content:center;padding:24px 0}
.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}
@media (max-width:440px){html,body{background:#F3F5F7}.stage{padding:0}.screen{border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="stage"><div class="screen" id="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; color: #101828; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden"><header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 6px; min-height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; flex: none"><a href="menu.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #101828; text-decoration: none; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a><div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h1 style="margin: 0; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 18px; font-weight: 800; line-height: 1.3">Reminder settings</h1></div></div></header><main style="flex: 1; min-height: 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 13px; font-weight: 500; color: #5B6576; line-height: 1.5">LIC already reminds its customers before the due date. Your messages work best as a personal follow-up.</p><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box"><label for="rs1" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">Before the due date</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">Off for LIC · 7 days before for health and motor</span></label><input type="checkbox" id="rs1" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; border-top: 1px solid #EEF0F3"><label for="rs2" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">After the due date if unpaid</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">Day 3 and day 10</span></label><input type="checkbox" id="rs2" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; border-top: 1px solid #EEF0F3"><label for="rs3" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">Before the policy lapses</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">7 days before the grace period ends</span></label><input type="checkbox" id="rs3" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; border-top: 1px solid #EEF0F3"><label for="rs4" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">Let me approve each message</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">Recommended for the first month</span></label><input type="checkbox" id="rs4" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; border-top: 1px solid #EEF0F3"><label for="rs5" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">No messages after 8 pm</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">Quiet hours</span></label><input type="checkbox" id="rs5" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div></div><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px"><div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Manrope', 'Anek Tamil', system-ui, sans-serif; letter-spacing: -0.02em; font-size: 16px; font-weight: 800">Message language</h2></div></div><div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" aria-pressed="false" style="min-height: 38px; padding: 0 14px; border-radius: 19px; background: #FFFFFF; color: #344054; border: 1px solid #D0D5DD; font-weight: 600; font-family: inherit; font-size: 13.5px; cursor: pointer">English</button><button type="button" aria-pressed="true" style="min-height: 38px; padding: 0 14px; border-radius: 19px; background: #0A6C5C; color: #FFFFFF; border: 1px solid #0A6C5C; font-weight: 700; font-family: inherit; font-size: 13.5px; cursor: pointer">தமிழ்</button><button type="button" aria-pressed="false" style="min-height: 38px; padding: 0 14px; border-radius: 19px; background: #FFFFFF; color: #344054; border: 1px solid #D0D5DD; font-weight: 600; font-family: inherit; font-size: 13.5px; cursor: pointer">Customer's choice</button></div><div style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05)"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box"><label for="rs6" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">Customers choose their own timing</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">A week or a month before</span></label><span style="padding: 1px 7px; border-radius: 6px; border: 1px solid currentColor; color: #1F4FA8; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; line-height: 1.6">Next version</span><input type="checkbox" id="rs6" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; box-sizing: border-box; border-top: 1px solid #EEF0F3"><label for="rs7" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 700">SMS if no WhatsApp</span><span style="font-size: 13px; font-weight: 500; color: #5B6576">For older customers</span></label><span style="padding: 1px 7px; border-radius: 6px; border: 1px solid currentColor; color: #475467; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; line-height: 1.6">Later</span><input type="checkbox" id="rs7" role="switch" style="width: 20px; height: 20px; accent-color: #0A6C5C; margin: 0; flex: none"></div></div></main></div>
</div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
</body>
</html>
