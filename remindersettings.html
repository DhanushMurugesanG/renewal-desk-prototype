<!doctype html>

<title>Reminder settings · Renewal Desk prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap">
<style>

html,body{background:#CBD5D3}.stage{display:flex;justify-content:center;padding:24px 0}
.screen{width:390px;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(19,39,43,.25);transform-origin:top center}

<div class="stage"><div class="screen" id="screen">

s: center; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-top: 1px solid #EDF1F0"><label for="rs2" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">After the due date if unpaid</span><span style="font-size: 13px; color: #5B6E73">Day 3 and day 10</span></label><input type="checkbox" id="rs2" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-top: 1px solid #EDF1F0"><label for="rs3" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Before the policy lapses</span><span style="font-size: 13px; color: #5B6E73">7 days before the grace period ends</span></label><input type="checkbox" id="rs3" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-top: 1px solid #EDF1F0"><label for="rs4" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Let me approve each message</span><span style="font-size: 13px; color: #5B6E73">Recommended for the first month</span></label><input type="checkbox" id="rs4" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0; flex: none"></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-top: 1px solid #EDF1F0"><label for="rs5" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">No messages after 8 pm</span><span style="font-size: 13px; color: #5B6E73">Quiet hours</span></label><input type="checkbox" id="rs5" checked="checked" role="switch" style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0; flex: none"></div></div><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 700">Message language</h2></div></div><div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 13px; border-radius: 18px; background: #FFFFFF; color: #13272B; border: 1px solid #C9D4D2; font: inherit; font-size: 13.5px; cursor: pointer">English</button><button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 13px; border-radius: 18px; background: #0B6E63; color: #FFFFFF; border: 0; font-weight: 600; font: inherit; font-size: 13.5px; cursor: pointer">தமிழ்</button><button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 13px; border-radius: 18px; background: #FFFFFF; color: #13272B; border: 1px solid #C9D4D2; font: inherit; font-size: 13.5px; cursor: pointer">Customer's choice</button></div><div style="background: #FFFFFF; border: 1px solid #DCE3E2; border-radius: 14px; overflow: hidden"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box"><label for="rs6" style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600">Customers choose their own timing</span><span style="font-size: 13px; color: #5B6E73">A week or a month before</span></label><span style="padding: 2px 8px; border-radius: 10px; background: #E3EBF7; color: #234B8A; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap">Next version</span><input type="checkbox" id="rs6" role="switch" style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0; flex: none"></div><div </div></div>
<script>
(function(){var s=document.getElementById('screen');function fit(){var k=Math.min(1,window.innerWidth/390);s.style.transform=k<1?'scale('+k+')':'';s.parentNode.style.height=k<1?(844*k)+'px':'';}fit();window.addEventListener('resize',fit);})();

</script>
